<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Depot Stop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#eaf3fa;--surf:#fff;--ink:#0f2438;--mut:#5b7186;--line:#d3e1ec;--n:#1769d1;--nbg:#dcebfc;--s:#e8590c;--sbg:#ffe6d6;--h1:#0f2d4d;--h2:#1c5c8f;--amb:#ffc24b;--ok:#17855e;--okbg:#d9f5e8;
--fd:"Fredoka","Trebuchet MS",ui-rounded,system-ui,sans-serif;--fb:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1827;--surf:#112a40;--ink:#eaf3fa;--mut:#93abbd;--line:#25435c;--n:#6fb2ff;--nbg:#173b63;--s:#ff9a5f;--sbg:#472a1b;--h1:#0a2038;--h2:#134a74;--ok:#5be0a5;--okbg:#12392b}}
:root[data-theme="dark"]{--bg:#0a1827;--surf:#112a40;--ink:#eaf3fa;--mut:#93abbd;--line:#25435c;--n:#6fb2ff;--nbg:#173b63;--s:#ff9a5f;--sbg:#472a1b;--h1:#0a2038;--h2:#134a74;--ok:#5be0a5;--okbg:#12392b}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--fb);font-variant-numeric:tabular-nums;padding-bottom:45vh}
button{font-family:inherit;color:inherit}button:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.hero{background:linear-gradient(160deg,var(--h1),var(--h2));color:#fff;padding:22px 18px 0;border-radius:0 0 34px 34px;position:relative;overflow:hidden;margin-bottom:16px}
.blind{display:inline-block;background:#06121f;color:var(--amb);font:700 12px/1 var(--fd);letter-spacing:.14em;padding:6px 10px;border-radius:6px;border:1px solid #27465f}
.hero h1{font:700 40px/1 var(--fd);margin:12px 0 6px;letter-spacing:-.01em}
.hero p{margin:0 0 8px;max-width:17em;opacity:.88;font-size:15px}
.track{height:34px;position:relative;margin:0 -18px}
.track:after{content:"";position:absolute;left:0;right:0;bottom:6px;height:4px;background:repeating-linear-gradient(90deg,#ffffff55 0 14px,transparent 14px 22px)}
.tram{position:absolute;right:20px;bottom:8px;width:112px;animation:roll 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes roll{from{transform:translateX(-300px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.tram{animation:none}.sheet{transition:none!important}}
main{max-width:640px;margin:0 auto;padding:0 14px}
.days{display:flex;gap:6px;margin-bottom:12px}
.days button{flex:1;min-width:0;border:2px solid var(--line);background:var(--surf);border-radius:16px;padding:8px 0 7px;font:600 14px var(--fd);cursor:pointer;position:relative}
.days button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days i{display:block;font:500 10px/1 var(--fb);margin-top:3px;opacity:.7;font-style:normal;height:10px}
.dirs{display:flex;gap:8px;margin-bottom:6px}
.dirs button{flex:1;border:2px solid var(--line);background:var(--surf);border-radius:14px 14px 14px 4px;padding:9px 6px;font:600 14px var(--fd);cursor:pointer;line-height:1.15}
.dirs button small{display:block;font:400 11px var(--fb);color:var(--mut)}
.dirs button[aria-pressed=true]{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.dirs .dn{color:var(--n)}.dirs .ds{color:var(--s)}
.lg{font-size:12px;color:var(--mut);margin:0 2px 4px}
.hb{display:flex;align-items:center;gap:10px;margin:16px 2px 8px;font:600 15px var(--fd);color:var(--mut)}
.hb:after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{background:var(--surf);border:2px solid var(--line);border-radius:14px;padding:8px 12px 8px 10px;font:600 20px/1 var(--fd);cursor:pointer;position:relative;min-height:48px;display:flex;align-items:center;gap:7px}
.chip svg{width:11px;height:11px;flex:none}
.chip.N,.chip.S{color:#fff;border-color:transparent}.chip.N{--dc:#1769d1;background:#1769d1}.chip.S{--dc:#e0540a;background:#e0540a}

.chip .mo{width:14px;height:14px;margin-left:1px}
.chip[aria-pressed=true]{border-color:var(--ink);color:var(--bg);background:var(--ink);color:var(--bg);transform:translateY(-2px);box-shadow:0 5px 0 var(--dc)}
.chip[aria-pressed=true] svg{color:var(--bg)}
.chip em{position:absolute;top:-8px;right:-6px;background:var(--amb);color:#3a2600;font:700 11px/1 var(--fd);border-radius:10px;padding:3px 6px;font-style:normal}
.empty{padding:34px 10px;text-align:center;color:var(--mut)}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-radius:26px 26px 0 0;max-height:72vh;overflow:auto;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 34px rgba(5,20,40,.28);transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}
.sheet.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sh{max-width:640px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top h2{font:700 24px/1.1 var(--fd);margin:0}
.top p{margin:3px 0 0;color:var(--mut);font-size:14px}
.x{border:0;background:var(--line);border-radius:50%;width:38px;height:38px;font:700 16px var(--fd);cursor:pointer;flex:none}
.pk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 6px;font:600 14px var(--fd)}
.pk button{border:2px solid var(--line);background:transparent;border-radius:18px;padding:5px 12px;font:600 14px var(--fd);cursor:pointer}
.pk button[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
details.dc{--dc:var(--n);border:2px solid var(--line);border-radius:20px;margin:10px 0;overflow:hidden}
details.dc.S{--dc:var(--s)}
details.dc summary{display:flex;gap:12px;align-items:center;padding:10px 12px;cursor:pointer;list-style:none}
details.dc summary::-webkit-details-marker{display:none}
details.dc summary:after{content:"\2304";margin-left:auto;font-size:22px;color:var(--mut);transition:transform .2s}
details.dc[open] summary:after{transform:rotate(180deg)}
.id{background:var(--dc);color:#fff;font:700 24px/1 var(--fd);padding:12px 10px;border-radius:14px 14px 14px 4px;min-width:76px;text-align:center}
.m{font-size:13px;color:var(--mut);line-height:1.35}.m strong{color:var(--ink);font-size:15px}
.at{display:inline-block;margin-top:3px;background:var(--okbg);color:var(--ok);font-weight:700;font-size:14px;border-radius:10px;padding:2px 9px}
.at.no{background:var(--line);color:var(--mut)}
.route{list-style:none;margin:2px 16px 14px 20px;padding:0;position:relative}
.route:before{content:"";position:absolute;left:5px;top:12px;bottom:12px;width:4px;border-radius:2px;background:var(--dc)}
.route li{position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px 7px 28px;font-size:15px}
.route li:before{content:"";position:absolute;left:0;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--surf);border:4px solid var(--dc)}
.route .tm{font:600 17px var(--fd)}.route .tm small{font-size:11px;color:var(--mut)}
.route li.me{background:var(--okbg);border-radius:12px;font-weight:700;color:var(--ok)}
.route li.me:before{background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 4px var(--okbg)}
.route li.me .tm small{color:var(--ok)}
.route li.end{font-weight:700}.route li.end:before{border-radius:4px;background:var(--dc);width:16px;height:16px;margin-top:-8px;left:-1px}
.route li span em{font:500 12px var(--fb);color:var(--mut);font-style:normal;margin-left:4px}
.foot{text-align:center;color:var(--mut);font-size:12px;margin:26px 0 0}

const DAYS=[["MON","Mon"],["TUE","Tue"],["WED","Wed"],["THU","Thu"],["FRI","Fri"],["SAT","Sat"],["SUN","Sun"]];
const SRC={MON:["SUN","MT"],TUE:["MT","MT"],WED:["MT","MT"],THU:["MT","MT"],FRI:["MT","FRI"],SAT:["FRI","SAT"],SUN:["SAT","SUN"]};
const DIRS=[["B","Both stops","DSPN + DSPS",""],["N","&#9650; DSPN","northbound","dn"],["S","&#9660; DSPS","southbound","ds"]];
const ST=["SOU","CAA","BBS","NBE","BUH","UNH","HVL"];
const g=new Date().getDay(),today=DAYS[(g+6)%7][0];
let day=today,dir="B",sel=null,pick=null,cur=null;
const $=id=>document.getElementById(id);
const fmt=s=>{s%=86400;return Math.floor(s/3600)+":"+String(Math.floor(s%3600/60)).padStart(2,"0")};
const hms=x=>fmt(x)+"<small>;"+String(x%60).padStart(2,"0")+"</small>";
const hmp=x=>fmt(x)+";"+String(x%60).padStart(2,"0");
const hlab=h=>h===0?"12 am":h<12?h+" am":h===12?"12 pm":(h-12)+" pm";
const pn=()=>DAYS[(DAYS.findIndex(d=>d[0]===day)+6)%7][1];
const leg=st=>{let i=0;st.forEach((s,k)=>{if(s[0]==="BUH"||s[0]==="HVL")i=k});return st.slice(i)};
const MOON='<svg class="mo" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 14.5A9 9 0 1 1 9.5 3 7 7 0 0 0 21 14.5z" fill="currentColor"/></svg>';
const arrow=n=>'<svg viewBox="0 0 10 10" aria-hidden="true"><path d="'+(n?"M5 0L10 9H0z":"M5 10L0 1h10z")+'" fill="currentColor"/></svg>';
function rowsFor(d){const[p,o]=SRC[d];
 return D[p].filter(r=>r[0]>=86400).map(r=>{const c=r.slice();c[0]-=86400;c.push(1);return c})
 .concat(D[o].filter(r=>r[0]<86400).map(r=>{const c=r.slice();c.push(0);return c}))
 .sort((a,b)=>a[0]-b[0]||(a[1]<b[1]?-1:a[1]>b[1]?1:0)||(a[2]<b[2]?-1:1))}
function drawTop(){
 $("days").innerHTML=DAYS.map(([k,l])=>'<button data-k="'+k+'" aria-pressed="'+(k===day)+'">'+l+'<i>'+(k===today?"today":"")+'</i></button>').join("");
 $("dirs").innerHTML=DIRS.map(([k,l,s,c])=>'<button data-k="'+k+'" class="'+c+'" aria-pressed="'+(k===dir)+'">'+l+'<small>'+s+'</small></button>').join("");
 document.querySelectorAll("#days button").forEach(b=>b.onclick=()=>{day=b.dataset.k;sel=null;cur=null;draw()});

function draw(){
 drawTop();
 const rows=rowsFor(day).filter(r=>dir==="B"||r[1]===dir),m=new Map();
 rows.forEach(r=>{const k=Math.floor(r[0]/60)+r[1]+r[7];if(!m.has(k))m.set(k,[]);m.get(k).push(r)});

  const c=document.createElement("div");c.className="chips";

  gr.appendChild(c)});

function render(){
